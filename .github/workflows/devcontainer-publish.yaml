name: Deprecated:Publish DevContainer Image
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  devcontainer-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Deprecation Warning
      run: |
        echo "This action is deprecated. Please use the 'Build and Publish DevContainer Image' reusable workflow instead."
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        sudo curl https://github.com/mikefarah/yq/releases/download/3.4.1/yq_linux_amd64 \
            -Lo /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
    - name: Determine metadata
      run: |
        PIP_PACKAGE_NAME=$(ls */version.py | cut -d '/' -f 1)
        echo "PIP_PACKAGE_NAME=${PIP_PACKAGE_NAME}" >> $GITHUB_ENV
    - name: Fetch image artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: image-devcontainer-${{env.PIP_PACKAGE_NAME}}
    - name: Load image
      run: docker load < "image-devcontainer-${PIP_PACKAGE_NAME}.tar.gz"
    - name: Login to Docker Hub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}
    - name: Publish image
      run: |
        IMAGE=$(yq r ./.devcontainer/docker-compose.yaml 'services.app.image')
        docker push "${IMAGE}"
